<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEON GRID — Wireframe Topo</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; font-family: ui-sans-serif, -apple-system, system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .label { position: fixed; top: 24px; left: 28px; color: rgba(255,180,255,.7); font-size: 11px; text-transform: uppercase; letter-spacing: .35em; pointer-events: none; user-select: none; }
  .num { position: fixed; top: 24px; right: 28px; color: rgba(255,180,255,.45); font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .25em; pointer-events: none; }
  .hint { position: fixed; bottom: 24px; left: 28px; color: rgba(255,180,255,.35); font-family: ui-monospace, Menlo, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .25em; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Neon Grid — Wireframe topo</div>
<div class="num">05 / 05</div>
<div class="hint">Mouse magnetizes the surface · Click sends a sine ripple outward</div>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) { document.body.innerHTML = 'WebGL2 required'; throw new Error('no webgl2'); }

const vs = `#version 300 es
in vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const fs = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 u_res;
uniform float u_t;
uniform vec2 u_m;
uniform vec2 u_click;
uniform float u_clickT;

vec2 toUV(vec2 p){ return (p - 0.5 * u_res) / min(u_res.x, u_res.y); }

// height field
float height(vec2 p, vec2 mu, vec2 cu, float age){
  // base waves
  float h = 0.0;
  h += 0.18 * sin(p.x * 4.0 + u_t * 0.6);
  h += 0.14 * sin(p.y * 5.0 - u_t * 0.45);
  h += 0.10 * sin((p.x + p.y) * 7.0 + u_t * 0.8);

  // mouse magnet (Gaussian dip)
  float dm = length(p - mu);
  h -= 0.55 * exp(-dm * dm * 6.0);

  // click ripple
  if (u_clickT > 0.0 && age < 4.0){
    float dc = length(p - cu);
    float radius = age * 0.6;
    float ripple = sin((dc - radius) * 22.0) * exp(-pow((dc - radius) * 4.0, 2.0));
    h += ripple * (1.0 - age / 4.0) * 0.45;
  }
  return h;
}

void main(){
  vec2 uv = toUV(gl_FragCoord.xy);
  vec2 mu = toUV(u_m);
  vec2 cu = toUV(u_click);
  float age = u_t - u_clickT;

  float h = height(uv, mu, cu, age);

  // grid lines based on (uv * scale) modulated by height
  vec2 g = uv * 12.0;
  // shift grid by height gradient for that "topo" feel
  float e = 0.005;
  float hx = (height(uv + vec2(e, 0), mu, cu, age) - height(uv - vec2(e, 0), mu, cu, age)) / (2.0 * e);
  float hy = (height(uv + vec2(0, e), mu, cu, age) - height(uv - vec2(0, e), mu, cu, age)) / (2.0 * e);
  vec2 grad = vec2(hx, hy);

  vec2 gridUV = g + grad * 1.5;
  vec2 cellEdge = abs(fract(gridUV - 0.5) - 0.5);
  float lineX = smoothstep(0.04, 0.0, cellEdge.x);
  float lineY = smoothstep(0.04, 0.0, cellEdge.y);
  float grid = max(lineX, lineY);

  // contour lines at fixed heights
  float contour = abs(fract(h * 5.0 + 0.5) - 0.5);
  float contourLine = smoothstep(0.06, 0.0, contour);

  // neon palette: magenta/cyan tilt by height
  vec3 magenta = vec3(1.0, 0.15, 0.85);
  vec3 cyan = vec3(0.2, 0.95, 1.0);
  vec3 col = mix(magenta, cyan, smoothstep(-0.6, 0.6, h));

  vec3 final = vec3(0.005, 0.0, 0.02);
  final += col * grid * 0.95;
  final += col * contourLine * 0.55;

  // mouse glow
  float dm = length(uv - mu);
  final += vec3(1.0, 0.5, 0.95) * exp(-dm * 4.0) * 0.7;

  // ripple highlight on click
  if (u_clickT > 0.0 && age < 4.0){
    float dc = length(uv - cu);
    float radius = age * 0.6;
    float bright = exp(-pow((dc - radius) * 8.0, 2.0)) * (1.0 - age / 4.0);
    final += vec3(0.9, 1.0, 0.7) * bright * 1.0;
  }

  // subtle scanlines
  final *= 0.92 + 0.08 * sin(gl_FragCoord.y * 1.4);

  // vignette
  final *= mix(0.55, 1.0, smoothstep(1.3, 0.3, length(uv)));

  // tone
  final = pow(final, vec3(0.95));
  o = vec4(final, 1.0);
}`;

function compile(t, src){
  const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const a = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);

const U = n => gl.getUniformLocation(prog, n);
const u_res = U('u_res'), u_t = U('u_t'), u_m = U('u_m'), u_click = U('u_click'), u_clickT = U('u_clickT');

const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
let mouse = [innerWidth/2, innerHeight/2];
let mSm = mouse.slice();
let click = [0,0], clickT = -100;

function resize(){
  canvas.width = innerWidth * dpr();
  canvas.height = innerHeight * dpr();
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize); resize();

addEventListener('pointermove', e => { mouse = [e.clientX * dpr(), (innerHeight - e.clientY) * dpr()]; });
addEventListener('pointerdown', e => {
  click = [e.clientX * dpr(), (innerHeight - e.clientY) * dpr()];
  clickT = (performance.now() - start) * 0.001;
});

const start = performance.now();
function frame(){
  const t = (performance.now() - start) * 0.001;
  mSm[0] += (mouse[0] - mSm[0]) * 0.10;
  mSm[1] += (mouse[1] - mSm[1]) * 0.10;
  gl.uniform2f(u_res, canvas.width, canvas.height);
  gl.uniform1f(u_t, t);
  gl.uniform2f(u_m, mSm[0], mSm[1]);
  gl.uniform2f(u_click, click[0], click[1]);
  gl.uniform1f(u_clickT, clickT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
