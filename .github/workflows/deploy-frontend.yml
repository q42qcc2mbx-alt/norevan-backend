name: Deploy Frontend (Vercel Production)

# Manually-triggered production deploy for the Next.js frontend.
#
# Why this exists: the Vercel project is deployed via the Vercel CLI, which
# needs an access token. CI runners (and remote agent sessions) don't have one,
# so deploys are gated behind a single repo secret.
#
# Required repo secret:
#   VERCEL_TOKEN — a Vercel access token with deploy rights to the project.
#     Create at https://vercel.com/account/settings/tokens
#     Add at  Repo → Settings → Secrets and variables → Actions → New secret
#
# We deploy from source (let Vercel build) rather than uploading a prebuilt
# output. Vercel then injects the project's real env — including variables
# marked "Sensitive", which `vercel pull` cannot download — and applies the
# project's Root Directory (frontend/). A local `vercel build` lacks both, which
# breaks NEXT_PUBLIC_* inlining (e.g. the Supabase client at build time).
# Org/Project IDs are not secret, so they live inline below.

on:
  workflow_dispatch: {} # run on demand from the Actions tab (or via API)

concurrency:
  group: deploy-vercel-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to production
    runs-on: ubuntu-latest
    # The Next.js app lives in frontend/. Vercel's Root Directory isn't applied
    # by a local `vercel build`, so run every step from frontend/ to build the
    # app (not the Express backend at the repo root).
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: team_qQfnOiJIWNqY0vwTx1dKYgJz
      VERCEL_PROJECT_ID: prj_wV0oFY2xM4TTr9UrdFc3yiMwDyvc
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Fail early if token is missing
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it under" \
                 "Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - name: Deploy to production (Vercel builds, injecting project env)
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### ✅ Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
