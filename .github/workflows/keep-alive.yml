name: Keep Supabase Awake

# Supabase free-tier pauses a project after ~7 days without database activity.
# This workflow hits an endpoint that runs a real DB query once a day, which
# resets that inactivity timer so the shop never goes "empty" again.

on:
  schedule:
    - cron: "23 5 * * *" # every day at 05:23 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend products endpoint (executes a DB query)
        run: |
          curl -sS -m 60 --retry 4 --retry-delay 15 --retry-all-errors \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "https://norevan-backend.onrender.com/api/v1/products"
